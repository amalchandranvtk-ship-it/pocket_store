{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if address %}Edit{% else %}Add{% endif %} Address</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body{background:#050505;color:white;font-family:Arial,sans-serif;}
    .box{max-width:650px;margin:50px auto;background:#111827;padding:35px;border-radius:14px;border:1px solid #222;}
    .form-control,.form-select{height:46px;background:#0b0b0b;color:white;border:1px solid #333;}
    textarea.form-control{height:80px;}
    .form-control:focus,.form-select:focus{background:#0b0b0b;color:white;border-color:#2563eb;box-shadow:none;}
    .btn-blue{background:#2563eb;color:white;border:none;border-radius:8px;padding:12px 24px;font-weight:700;}
    .btn-line{border:1px solid #444;color:white;border-radius:8px;padding:12px 24px;text-decoration:none;}
    .message-container{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    z-index:99999;

    display:flex;
    flex-direction:column;
    gap:10px;

    align-items:center;
}

.toast-message{
    min-width:300px;
    max-width:500px;

    padding:14px 22px;
    border-radius:12px;

    color:white;
    font-weight:600;
    text-align:center;

    box-shadow:0 8px 25px rgba(0,0,0,.18);

    animation:fadeIn .3s ease;
}

.toast-message.success{
    background:#16a34a;
}

.toast-message.error,
.toast-message.danger{
    background:#dc2626;
}

.toast-message.warning{
    background:#f59e0b;
}

.toast-message.info{
    background:#2563eb;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(-15px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes fadeOut{
    from{
        opacity:1;
        transform:translateY(0);
    }
    to{
        opacity:0;
        transform:translateY(-15px);
    }
}
  </style>
</head>
<body>

<div class="box">
  <h2>{% if address %}Edit Address{% else %}Add Address{% endif %}</h2>
  <p class="text-secondary">Fill your delivery address details.</p>

{% if messages %}
<div class="message-container">
    {% for message in messages %}
        <div class="toast-message {{ message.tags }}">
            {{ message }}
        </div>
    {% endfor %}
</div>
{% endif %}

  <form method="POST">
    {% csrf_token %}

    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Full Name</label>
        <input type="text" name="full_name" value="{{ address.full_name }}" class="form-control" required>
      </div>

      <div class="col-md-6">
        <label class="form-label">Phone Number</label>
        <input type="text" name="phone" value="{{ address.phone }}" class="form-control" required>
      </div>

      <div class="col-12">
        <label class="form-label">Address Line 1</label>
        <input type="text" name="address_line1" value="{{ address.address_line1 }}" class="form-control" required>
      </div>

      <div class="col-12">
        <label class="form-label">Address Line 2</label>
        <input type="text" name="address_line2" value="{{ address.address_line2 }}" class="form-control">
      </div>

      <div class="col-md-4">
        <label class="form-label">City</label>
        <input type="text" name="city" value="{{ address.city }}" class="form-control" required>
      </div>

      <div class="col-md-4">
        <label class="form-label">State</label>
        <input type="text" name="state" value="{{ address.state }}" class="form-control" required>
      </div>

      <div class="col-md-4">
        <label class="form-label">Zip Code</label>
        <input type="text" name="zip_code" value="{{ address.zip_code }}" class="form-control" required>
      </div>

      <div class="col-md-6">
        <label class="form-label">Country</label>
        <input type="text" name="country" value="{{ address.country|default:'India' }}" class="form-control" required>
      </div>

      <div class="col-md-6">
        <label class="form-label">Address Type</label>
        <select name="address_type" class="form-select">
          <option value="home" {% if address.address_type == 'home' %}selected{% endif %}>Home</option>
          <option value="work" {% if address.address_type == 'work' %}selected{% endif %}>Work</option>
          <option value="other" {% if address.address_type == 'other' %}selected{% endif %}>Other</option>
        </select>
      </div>

      <div class="col-12">
        <input type="checkbox" name="is_default" {% if address.is_default %}checked{% endif %}>
        <label>Set as default address</label>
      </div>
    </div>

    <div class="d-flex justify-content-end gap-3 mt-4">
      <a href="{% url 'address_list' %}" class="btn-line">Cancel</a>
      <button type="submit" class="btn-blue">Save Address</button>
    </div>
  </form>
</div>


<script>
setTimeout(function(){

    document.querySelectorAll(".toast-message").forEach(function(msg){

        msg.style.animation = "fadeOut 0.4s ease forwards";

        setTimeout(function(){
            msg.remove();
        },400);

    });

},3000);
</script>
</body>
</html>
