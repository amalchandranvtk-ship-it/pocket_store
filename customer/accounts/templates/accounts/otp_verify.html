{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PocketStore OTP Verification</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    html,
    body{
      width:100%;
      height:100%;
      overflow:hidden;
      background:#111827;
    }

    .otp-page{
      width:100%;
      height:100vh;
      position:relative;
      background:
      linear-gradient(rgba(15,23,42,0.10), rgba(15,23,42,0.55)),
      url("{% static 'images/customer_otp.png' %}");
      background-size:cover;
      background-position:center center;
      background-repeat:no-repeat;
    }

    .brand-header{
      position:absolute;
      top:28px;
      left:35px;
      z-index:5;
      color:#ffffff;
      font-size:24px;
      font-weight:800;
      text-decoration:none;
    }

    .otp-wrapper{
      width:100%;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:flex-end;
      padding-right:12%;
    }

    .otp-card{
      width:100%;
      max-width:420px;
      background:#ffffff;
      border-radius:14px;
      padding:32px;
      box-shadow:0 20px 50px rgba(0,0,0,0.25);
    }

    .back-link{
      color:#6b7280;
      font-size:13px;
      text-decoration:none;
      display:inline-block;
      margin-bottom:22px;
    }

    .mini-brand{
      color:#2563eb;
      font-size:15px;
      font-weight:800;
      margin-bottom:28px;
    }

    .otp-card h2{
      font-size:28px;
      font-weight:800;
      color:#111827;
      margin-bottom:8px;
    }

    .otp-card p{
      font-size:13px;
      color:#6b7280;
      margin-bottom:22px;
      line-height:1.6;
    }

    .otp-inputs{
      display:flex;
      justify-content:space-between;
      gap:8px;
      margin-bottom:20px;
    }

    .otp-inputs input{
      flex:1;
      width:56px;
      height:56px;
      border:1px solid #d1d5db;
      border-radius:10px;
      text-align:center;
      font-size:22px;
      font-weight:700;
      outline:none;
    }

    .otp-card{
    overflow:hidden;
}
    .otp-inputs input:focus{
      border-color:#2563eb;
      box-shadow:0 0 0 4px rgba(37,99,235,0.12);
    }

    .otp-info{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:24px;
      font-size:12px;
      color:#6b7280;
    }

    .resend{
      color:#2563eb;
      font-weight:700;
      text-decoration:none;
      pointer-events:auto;
      opacity:1;
    }

    .resend:hover{
      color:#1d4ed8;
    }

    .verify-btn{
      width:100%;
      height:50px;
      border:none;
      border-radius:9px;
      background:#2563eb;
      color:#ffffff;
      font-size:14px;
      font-weight:700;
      box-shadow:0 10px 20px rgba(37,99,235,0.28);
    }

    .verify-btn:hover{
      background:#1d4ed8;
    }

    @media(max-width:991px){
      html,
      body{
        overflow:auto;
      }

      .otp-page{
        min-height:100vh;
        height:auto;
      }

      .otp-wrapper{
        height:auto;
        min-height:100vh;
        justify-content:center;
        padding:100px 20px 40px;
      }

      .brand-header{
        top:24px;
        left:24px;
      }
    }

    @media(max-width:576px){
      .otp-card{
        padding:26px 22px;
      }

      .otp-inputs{
        gap:8px;
      }

      .otp-inputs input{
        width:50px;
        height:52px;
      }

      .otp-card h2{
        font-size:24px;
      }
    }
.message-container{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    z-index:99999;

    display:flex;
    flex-direction:column;
    gap:10px;

    align-items:center;
}

.toast-message{
    min-width:300px;
    max-width:500px;

    padding:14px 22px;
    border-radius:12px;

    color:white;
    font-weight:600;
    text-align:center;

    box-shadow:0 8px 25px rgba(0,0,0,.18);

    animation:fadeIn .3s ease;
}

.toast-message.success{
    background:#16a34a;
}

.toast-message.error,
.toast-message.danger{
    background:#dc2626;
}

.toast-message.warning{
    background:#f59e0b;
}


.toast-message.info{
    background:#2563eb;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(-15px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes fadeOut{
    from{
        opacity:1;
        transform:translateY(0);
    }
    to{
        opacity:0;
        transform:translateY(-15px);
    }
}

@keyframes slideDown{
  from{
    opacity:0;
    transform:translateY(-8px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}
  </style>
</head>

<body>

<div class="otp-page">

  <a href="#" class="brand-header">
    <i class="bi bi-bag-check-fill"></i>
    PocketStore
  </a>

  <div class="otp-wrapper">

    <div class="otp-card">

      <a href="{% url back_url %}" class="back-link">
        <i class="bi bi-arrow-left"></i>
        {{ back_text }}
      </a>

      <div class="mini-brand">
        <i class="bi bi-bag-check-fill"></i>
        PocketStore
      </div>

      <h2>{{ title }}</h2>

      <p>
        We sent a 6-digit code to your email <strong>{{ email }}</strong>
      </p>

{% if messages %}
<div class="message-container">
    {% for message in messages %}
        <div class="toast-message {{ message.tags }}">
            {{ message }}
        </div>
    {% endfor %}
</div>
{% endif %}

<form method="POST">


        {% csrf_token %}

        <div class="otp-inputs">
          <input type="text" maxlength="1" name="otp1" inputmode="numeric" autocomplete="one-time-code">
          <input type="text" maxlength="1" name="otp2" inputmode="numeric">
          <input type="text" maxlength="1" name="otp3" inputmode="numeric">
          <input type="text" maxlength="1" name="otp4" inputmode="numeric">
          <input type="text" maxlength="1" name="otp5" inputmode="numeric">
          <input type="text" maxlength="1" name="otp6" inputmode="numeric">
        </div>

        <div class="otp-info">
          <span>
            <i class="bi bi-clock"></i>
            <span id="timer">01:00</span>
          </span>

          <a href="{% url 'customer_resend_otp' %}" id="resendBtn" class="resend">
            RESEND CODE
          </a>
        </div>

        <button type="submit" class="verify-btn">
          Verify & Proceed
          <i class="bi bi-arrow-right"></i>
        </button>
      </form>

    </div>

  </div>

</div>

<script>
  const otpInputs = document.querySelectorAll(".otp-inputs input");

  otpInputs.forEach((input, index) => {
    input.addEventListener("input", function () {
      this.value = this.value.replace(/[^0-9]/g, "");

      if (this.value.length === 1 && index < otpInputs.length - 1) {
        otpInputs[index + 1].focus();
      }
    });

    input.addEventListener("keydown", function (event) {
      if (event.key === "Backspace" && this.value === "" && index > 0) {
        otpInputs[index - 1].focus();
      }
    });

    input.addEventListener("paste", function (event) {
      event.preventDefault();

      const pastedData = event.clipboardData.getData("text").replace(/[^0-9]/g, "");

      pastedData.slice(0, 6).split("").forEach((number, i) => {
        if (otpInputs[i]) {
          otpInputs[i].value = number;
        }
      });

      const lastIndex = Math.min(pastedData.length, otpInputs.length) - 1;

      if (lastIndex >= 0) {
        otpInputs[lastIndex].focus();
      }
    });
  });

  let timeLeft = Number("{{ timer_seconds|default:60 }}");
  const timer = document.getElementById("timer");

  function updateTimer() {
    let minutes = Math.floor(timeLeft / 60);
    let seconds = timeLeft % 60;

    timer.textContent =
      String(minutes).padStart(2, "0") + ":" +
      String(seconds).padStart(2, "0");

    if (timeLeft <= 0) {
      clearInterval(countdown);
      timer.textContent = "Expired";
      return;
    }

    timeLeft--;
  }

  updateTimer();
  const countdown = setInterval(updateTimer, 1000);
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
setTimeout(function(){

    document.querySelectorAll(".toast-message").forEach(function(msg){

        msg.style.animation = "fadeOut 0.4s ease forwards";

        setTimeout(function(){
            msg.remove();
        },400);

    });

},3000);
</script>

</body>
</html>
