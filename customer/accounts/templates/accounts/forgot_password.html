{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Forgot Password</title>


  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


  <link rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      min-height:100vh;
      overflow-x:hidden;
      background:#111827;
    }


    .forgot-wrapper{
      width:100%;
      min-height:100vh;
      position:relative;
    }


    .bg-image{

      min-height:100vh;

      background:
      linear-gradient(rgba(15,23,42,0.15),
      rgba(15,23,42,0.55)),

      url("{% static 'images/customer_forgot_password.png' %}")

      center center/cover no-repeat;

      position:relative;
    }


    .brand{

      position:absolute;

      top:35px;
      left:40px;

      color:white;

      font-size:24px;
      font-weight:700;

      z-index:10;
    }


    .forgot-card{

      position:absolute;

      top:50%;
      right:8%;

      transform:translateY(-50%);

      width:100%;
      max-width:420px;

      background:white;

      padding:40px;

      border-radius:18px;

      box-shadow:0 15px 35px rgba(0,0,0,0.18);
    }

    .forgot-card h2{

      font-size:34px;
      font-weight:800;

      color:#111827;

      margin-bottom:10px;
    }

    .forgot-card p{

      color:#6b7280;

      font-size:15px;

      line-height:1.6;

      margin-bottom:30px;
    }


    .form-label{

      font-size:13px;
      font-weight:600;

      color:#374151;

      margin-bottom:8px;
    }

    .input-group-text{

      background:white;

      border-right:none;

      border-radius:12px 0 0 12px;
    }

    .form-control{

      height:54px;

      border-radius:12px;

      border:1px solid #d1d5db;

      border-left:none;

      font-size:14px;
    }

    .form-control:focus{

      border-color:#2563eb;

      box-shadow:0 0 0 5px rgba(37,99,235,0.12);
    }


    .submit-btn{

      width:100%;

      height:54px;

      border:none;

      border-radius:12px;

      background:#2563eb;

      color:white;

      font-size:16px;
      font-weight:700;

      margin-top:12px;

      transition:0.3s;

      box-shadow:0 10px 20px rgba(37,99,235,0.25);
    }

    .submit-btn:hover{
      background:#1d4ed8;
    }


    .divider{

      display:flex;
      align-items:center;

      gap:12px;

      margin:28px 0;

      color:#9ca3af;

      font-size:13px;
    }

    .divider::before,
    .divider::after{

      content:"";

      flex:1;

      height:1px;

      background:#e5e7eb;
    }


    .back-login{

      text-align:center;

      margin-top:10px;
    }

    .back-login a{

      text-decoration:none;

      color:#2563eb;

      font-size:14px;
      font-weight:700;
    }


    @media(max-width:991px){

      .forgot-card{

        position:relative;

        top:auto;
        right:auto;

        transform:none;

        margin:40px auto;

        max-width:90%;
      }

      .bg-image{
        display:flex;
        justify-content:center;
        align-items:center;
        padding:20px;
      }

      .brand{

        top:20px;
        left:20px;

        font-size:20px;
      }

    }

    @media(max-width:576px){

      .forgot-card{
        padding:28px;
      }

      .forgot-card h2{
        font-size:28px;
      }

      .brand{
        font-size:18px;
      }

    }
 .message-container{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    z-index:99999;

    display:flex;
    flex-direction:column;
    gap:10px;

    align-items:center;
}

.toast-message{
    min-width:300px;
    max-width:500px;

    padding:14px 22px;
    border-radius:12px;

    color:white;
    font-weight:600;
    text-align:center;

    box-shadow:0 8px 25px rgba(0,0,0,.18);

    animation:fadeIn .3s ease;
}

.toast-message.success{
    background:#16a34a;
}

.toast-message.error,
.toast-message.danger{
    background:#dc2626;
}


.toast-message.warning{
    background:#f59e0b;
}


.toast-message.info{
    background:#2563eb;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(-15px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes fadeOut{
    from{
        opacity:1;
        transform:translateY(0);
    }
    to{
        opacity:0;
        transform:translateY(-15px);
    }
}

@keyframes slideDown{
  from{
    opacity:0;
    transform:translateY(-8px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

  </style>
</head>

<body>

<div class="forgot-wrapper">


  <div class="bg-image">


    <div class="brand">

      <i class="bi bi-bag-check-fill"></i>

      PocketStore

    </div>


    <div class="forgot-card">

      <h2>
        Forgot Password?
      </h2>

      <p>
        Enter your email to receive a password reset OTP.
      </p>


{% if messages %}
<div class="message-container">
    {% for message in messages %}
        <div class="toast-message {{ message.tags }}">
            {{ message }}
        </div>
    {% endfor %}
</div>
{% endif %}

<form method="POST">


      <form method="POST">

        {% csrf_token %}

        <div class="mb-3">

          <label class="form-label">
            Email Address
          </label>

          <div class="input-group">

            <span class="input-group-text">

              <i class="bi bi-envelope"></i>

            </span>

            <input type="email" name="email"
            class="form-control"
            placeholder="Enter your email">

          </div>

        </div>


        <button type="submit"
        class="submit-btn">

          Send OTP

          <i class="bi bi-arrow-right"></i>

        </button>

      </form>


      <div class="divider">

        OR

      </div>


      <div class="back-login">

        <a href="{% url 'customer_login' %}">

          <i class="bi bi-arrow-left"></i>

          Back to Login

        </a>

      </div>

    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
setTimeout(function(){

    document.querySelectorAll(".toast-message").forEach(function(msg){

        msg.style.animation = "fadeOut 0.4s ease forwards";

        setTimeout(function(){
            msg.remove();
        },400);

    });

},3000);
</script>

</body>
</html>
