{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body{background:#050505;color:white;font-family:Arial,sans-serif;}
    .box{max-width:500px;margin:70px auto;background:#111827;padding:35px;border-radius:14px;border:1px solid #222;}
    .form-control{height:48px;background:#0b0b0b;color:white;border:1px solid #333;}
    .form-control:focus{background:#0b0b0b;color:white;border-color:#2563eb;box-shadow:none;}
    .btn-blue{height:48px;background:#2563eb;color:white;border:none;border-radius:8px;font-weight:700;}
    a{color:#9ca3af;text-decoration:none;}
    .message-container{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    z-index:99999;

    display:flex;
    flex-direction:column;
    gap:10px;

    align-items:center;
}

.toast-message{
    min-width:300px;
    max-width:500px;

    padding:14px 22px;
    border-radius:12px;

    color:white;
    font-weight:600;
    text-align:center;

    box-shadow:0 8px 25px rgba(0,0,0,.18);

    animation:fadeIn .3s ease;
}


.toast-message.success{
    background:#16a34a;
}


.toast-message.error,
.toast-message.danger{
    background:#dc2626;
}


.toast-message.warning{
    background:#f59e0b;
}


.toast-message.info{
    background:#2563eb;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(-15px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes fadeOut{
    from{
        opacity:1;
        transform:translateY(0);
    }
    to{
        opacity:0;
        transform:translateY(-15px);
    }
}
  </style>
</head>
<body>

<div class="box">
  <h2>Change Password</h2>
  <p class="text-secondary">Enter your old and new password.</p>

 {% if messages %}
<div class="message-container">
    {% for message in messages %}
        <div class="toast-message {{ message.tags }}">
            {{ message }}
        </div>
    {% endfor %}
</div>
{% endif %}

  <form method="POST">
    {% csrf_token %}

    <label class="form-label">Old Password</label>
    <input type="password" name="old_password" class="form-control mb-3">

    <label class="form-label">New Password</label>
    <input type="password" name="new_password" class="form-control mb-3">

    <label class="form-label">Confirm Password</label>
    <input type="password" name="confirm_password" class="form-control mb-4">

    <button type="submit" class="btn-blue w-100">Change Password</button>
  </form>

  <div class="text-center mt-3">
    <a href="{% url 'customer_home' %}">Back to Profile</a>
  </div>
</div>

<script>
setTimeout(function(){

    document.querySelectorAll(".toast-message").forEach(function(msg){

        msg.style.animation = "fadeOut 0.4s ease forwards";

        setTimeout(function(){
            msg.remove();
        },400);

    });

},3000);
</script>

</body>
</html>
