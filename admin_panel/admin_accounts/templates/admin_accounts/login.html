<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PocketStore Admin Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    html,
    body{
      width:100%;
      height:100%;
      overflow:hidden;
      background:#111827;
      color:#fff;
    }

    .main-wrapper{
      width:100%;
      height:100vh;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }

    .header{
      height:64px;
      display:flex;
      align-items:center;
      padding:0 32px;
      border-bottom:1px solid rgba(255,255,255,0.08);
      flex-shrink:0;
    }

    .brand-name{
      font-size:22px;
      font-weight:700;
      color:#ffffff;
      text-decoration:none;
      display:flex;
      align-items:center;
      gap:9px;
    }

    .login-section{
      flex:1;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:15px;
      overflow:hidden;
    }

    .login-card{
      width:100%;
      max-width:400px;
      background:#f8fafc;
      color:#111827;
      border-radius:14px;
      padding:30px;
      box-shadow:0 25px 60px rgba(0,0,0,0.35);
    }

    .lock-box{
      width:52px;
      height:52px;
      background:#2563eb;
      color:#fff;
      border-radius:10px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:23px;
      margin:0 auto 18px;
      box-shadow:0 8px 20px rgba(37,99,235,0.35);
    }

    .login-card h2{
      font-size:28px;
    }

    .login-card p{
      font-size:14px;
      margin-bottom:22px !important;
    }

    .form-label{
      font-size:14px;
      margin-bottom:7px;
    }

    .form-control{
      height:48px;
      background:#f1f5ff;
      border:1px solid #cfd8ef;
      border-radius:8px;
      padding-left:44px;
      font-size:14px;
    }

    .input-icon{
      position:absolute;
      left:15px;
      top:50%;
      transform:translateY(-50%);
      color:#6b7280;
    }

    .eye-icon{
      position:absolute;
      right:15px;
      top:50%;
      transform:translateY(-50%);
      color:#6b7280;
      cursor:pointer;
    }

    .login-btn{
      height:48px;
      background:#2563eb;
      border:none;
      border-radius:9px;
      font-weight:600;
      box-shadow:0 8px 18px rgba(37,99,235,0.35);
    }

    .login-btn:hover{
      background:#1d4ed8;
    }

    .footer{
      height:60px;
      border-top:1px solid rgba(255,255,255,0.08);
      color:#9ca3af;
      font-size:13px;
      flex-shrink:0;
      display:flex;
      align-items:center;
      padding:0 32px;
    }

    .footer a{
      color:#9ca3af;
      text-decoration:none;
      margin-left:24px;
    }

    .footer a:hover{
      color:#ffffff;
    }

    @media(max-width:576px){
      html,
      body{
        overflow:auto;
      }

      .main-wrapper{
        height:auto;
        min-height:100vh;
        overflow:auto;
      }

      .header{
        padding:0 20px;
      }

      .brand-name{
        font-size:20px;
      }

      .login-card{
        padding:26px 22px;
      }

      .login-section{
        padding:20px 15px;
      }

      .footer{
        height:auto;
        padding:18px 20px;
        text-align:center;
      }

      .footer .footer-content{
        width:100%;
      }

      .footer .links{
        margin-top:10px;
      }

      .footer a{
        margin:0 10px;
      }
    }

    @keyframes slideDown {
      0% {
        transform: translateY(-20px);
        opacity: 0;
      }
      100% {
        transform: translateY(0);
        opacity: 1;
      }
    }

  .message-container{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    z-index:99999;

    display:flex;
    flex-direction:column;
    gap:10px;

    align-items:center;
}

.toast-message{
    min-width:300px;
    max-width:500px;

    padding:14px 22px;
    border-radius:12px;

    color:white;
    font-weight:600;
    text-align:center;

    box-shadow:0 8px 25px rgba(0,0,0,.18);

    animation:fadeIn .3s ease;
}


.toast-message.success{
    background:#16a34a;
}

.toast-message.error,
.toast-message.danger{
    background:#dc2626;
}


.toast-message.warning{
    background:#f59e0b;
}


.toast-message.info{
    background:#2563eb;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(-15px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes fadeOut{
    from{
        opacity:1;
        transform:translateY(0);
    }
    to{
        opacity:0;
        transform:translateY(-15px);
    }
}


  </style>
</head>

<body>

  {% if messages %}
<div class="message-container">
    {% for message in messages %}
        <div class="toast-message {{ message.tags }}">
            {{ message }}
        </div>
    {% endfor %}
</div>
{% endif %}

<div class="main-wrapper">

  <header class="header">
    <a href="#" class="brand-name">
      <i class="bi bi-bag-check-fill"></i>
      PocketStore
    </a>
  </header>

  <section class="login-section">

    <div class="login-card">

      <div class="lock-box">
        <i class="bi bi-lock-fill"></i>
      </div>

      <h2 class="text-center fw-bold mb-2">PocketStore Admin</h2>

      <p class="text-center text-muted">
        Secure access for authorized staff only
      </p>


      <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
          <label class="form-label">Email Address</label>

          <div class="position-relative">
            <i class="bi bi-person input-icon"></i>
            <input type="email" name="email" class="form-control"  placeholder="Enter your email" >
          </div>
        </div>

        <div class="mb-3">

          <div class="d-flex justify-content-between">
            <label class="form-label">Password</label>
            <a href="{% url 'admin_forgot_password' %}" class="text-decoration-none small text-primary">
              Forgot Password?
            </a>
          </div>

          <div class="position-relative">
            <i class="bi bi-lock input-icon"></i>
            <input type="password"  id="password" name="password" class="form-control"  placeholder="Enter your password" >
            <i class="bi bi-eye eye-icon" id="togglePassword"></i>
          </div>

        </div>

        <button type="submit" class="btn btn-primary w-100 login-btn mt-2">
          Login
        </button>

      </form>

    </div>

  </section>

  <footer class="footer">

    <div class="footer-content d-flex flex-column flex-md-row justify-content-between align-items-center w-100">

      <div>© 2024 PocketStore. All rights reserved.</div>

      <div class="links">
        <a href="#">Privacy Policy</a>
        <a href="#">Terms of Service</a>
        <a href="#">Security Status</a>
      </div>

    </div>

  </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
const togglePassword = document.getElementById("togglePassword");
const password = document.getElementById("password");

togglePassword.addEventListener("click", function () {

    if (password.type === "password") {
        password.type = "text";
        this.classList.remove("bi-eye");
        this.classList.add("bi-eye-slash");
    } else {
        password.type = "password";
        this.classList.remove("bi-eye-slash");
        this.classList.add("bi-eye");
    }

});
</script>

<script>
setTimeout(function(){

    document.querySelectorAll(".toast-message").forEach(function(msg){

        msg.style.animation = "fadeOut 0.4s ease forwards";

        setTimeout(function(){
            msg.remove();
        },400);

    });

},5000);
</script>
</body>
</html>
